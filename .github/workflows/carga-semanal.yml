name: Carga semanal ANP

# A ANP publica os dados da semana aos poucos; sábado antecipa a atualização,
# quarta-feira funciona como segunda oportunidade após atrasos de publicação.
on:
  schedule:
    - cron: "0 12 * * 3,6"
  workflow_dispatch:
    inputs:
      url:
        description: "URL da planilha oficial da ANP (opcional)"
        required: false

jobs:
  carregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r loader/requirements.txt

      - name: Rodar testes do carregador
        run: python -m pytest loader/tests -q

      - name: Carregar dados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANP_CSV_URL: ${{ inputs.url }}
        run: |
          URL="${ANP_CSV_URL:-$(python loader/anp_latest.py)}"
          python loader/loader.py --url "$URL"
