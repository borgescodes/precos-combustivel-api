name: Carga semanal ANP

# A ANP publica os dados da semana aos poucos; sábado antecipa a atualização,
# quarta-feira funciona como segunda oportunidade após atrasos de publicação.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/carga-semanal.yml"
      - "loader/**"
  schedule:
    - cron: "0 12 * * 3,6"
  workflow_dispatch:
    inputs:
      url:
        description: "URL da planilha oficial da ANP (opcional)"
        required: false

jobs:
  carregar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r loader/requirements.txt

      - name: Rodar testes do carregador
        run: python -m pytest loader/tests -q

      - name: Carregar dados
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANP_CSV_URL: ${{ inputs.url }}
        run: |
          URL="${ANP_CSV_URL:-$(python loader/anp_latest.py)}"
          python loader/loader.py --url "$URL"


      - name: Conferir referência de Paragominas
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT semana_inicio, semana_fim, produto,
                             preco_medio, preco_maximo, postos_pesquisados
                      FROM resumo_semanal
                      WHERE uf = 'PA' AND municipio = 'PARAGOMINAS'
                        AND produto LIKE 'GASOLINA%'
                      ORDER BY semana_inicio DESC, produto
                      LIMIT 12
                  """)
                  for row in cur.fetchall():
                      print("Paragominas ANP:", row)
          PY
